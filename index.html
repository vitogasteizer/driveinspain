<body>
  <div id="__bundler_placeholder">Loading España Drive...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

weight:600;color:#18251f\">ZBE<\u002Fa>\n  <a href=\"#labels\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:block;padding:12px 10px;border-radius:10px;text-decoration:none;font-weight:600;color:#18251f\">DGT ეტიკეტები<\u002Fa>\n  <div style=\"font-size:11px;font-weight:800;letter-spacing:1.2px;color:#176b4a;padding:10px 4px 4px\">ნიშნები და პარკირება<\u002Fdiv>\n  <a href=\"#signs\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:block;padding:12px 10px;border-radius:10px;text-decoration:none;font-weight:600;color:#18251f\">საგზაო ნიშნები<\u002Fa>\n  <a href=\"#parking\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:block;padding:12px 10px;border-radius:10px;text-decoration:none;font-weight:600;color:#18251f\">პარკირება და ფერები<\u002Fa>\n  <a href=\"#ota\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:block;padding:12px 10px;border-radius:10px;text-decoration:none;font-weight:600;color:#18251f\">ვიტორიის OTA<\u002Fa>\n  <div style=\"font-size:11px;font-weight:800;letter-spacing:1.2px;color:#176b4a;padding:10px 4px 4px\">ლექსიკონი და სიტუაციები<\u002Fdiv>\n  <a href=\"#dictionary\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:block;padding:12px 10px;border-radius:10px;text-decoration:none;font-weight:600;color:#18251f\">ლექსიკონი<\u002Fa>\n  <a href=\"#situations\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:block;padding:12px 10px;border-radius:10px;text-decoration:none;font-weight:600;color:#18251f\">ავარია, პოლიცია, დაზღვევა<\u002Fa>\n  <a href=\"#emergency\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"display:block;padding:12px 10px;border-radius:10px;text-decoration:none;font-weight:600;color:#18251f\">საგანგებო ნომრები<\u002Fa>\n<\u002Fnav>\n<\u002Fsc-if>\n\n<section style=\"background:#10231d;color:#fff;margin:0 -16px;padding:28px 16px 32px;border-radius:0 0 28px 28px\">\n  <div style=\"color:#d9f36a;font-size:12px;font-weight:800;letter-spacing:1.5px\">ქართველი მძღოლის გზამკვლევი ესპანეთში<\u002Fdiv>\n  <h1 style=\"font-size:34px;line-height:1.1;margin:10px 0 12px;letter-spacing:-.8px\">ესპანეთის გზები<br>გასაგებად.<\u002Fh1>\n  <p style=\"margin:0;color:#d1ddd5;font-size:15px\">გზის ნომრები, ფასიანი გზები, ნიშნები, პარკირება, ZBE და ის სიტყვები, რომლებიც დაგჭირდება პოლიციასთან, ავარიის ან დაზღვევის დროს.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px\">\n    <a href=\"#roads\" style=\"background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;padding:12px 6px;color:#fff;text-decoration:none;text-align:center;font-size:12px;font-weight:700\">გზები<\u002Fa>\n    <a href=\"#parking\" style=\"background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;padding:12px 6px;color:#fff;text-decoration:none;text-align:center;font-size:12px;font-weight:700\">პარკირება<\u002Fa>\n    <a href=\"#situations\" style=\"background:#ffffff12;border:1px solid #ffffff20;border-radius:14px;padding:12px 6px;color:#fff;text-decoration:none;text-align:center;font-size:12px;font-weight:700\">სიტუაციები<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"roads\" style=\"padding-top:28px\">\n  <h2 style=\"font-size:24px;margin:0 0 4px;letter-spacing:-.4px\">გზის აღნიშვნები<\u002Fh2>\n  <p style=\"margin:0 0 14px;font-size:13px;color:#66736c\">ასო + ნომერი<\u002Fp>\n  <div style=\"display:grid;gap:10px\">\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><b style=\"display:inline-block;background:#1465a6;color:#fff;border-radius:7px;padding:4px 10px\">A-1<\u002Fb><h3 style=\"margin:8px 0 4px;font-size:16px\">Autovía / Autopista<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">მაღალი გამტარობის გზები. A-გზები, როგორც წესი, უფასოა.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><b style=\"display:inline-block;background:#1465a6;color:#fff;border-radius:7px;padding:4px 10px\">AP-6<\u002Fb><h3 style=\"margin:8px 0 4px;font-size:16px\">Autopista de peaje<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">ტრადიციულად ფასიანი ავტოპისტა. მონაკვეთის საფასური ყოველთვის გადაამოწმე.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><b style=\"display:inline-block;background:#c43e36;color:#fff;border-radius:7px;padding:4px 10px\">N-1<\u002Fb><h3 style=\"margin:8px 0 4px;font-size:16px\">Carretera Nacional<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">სახელმწიფო ეროვნული გზა. უმეტესად უფასოა.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><b style=\"display:inline-block;background:#1465a6;color:#fff;border-radius:7px;padding:4px 10px\">M-40<\u002Fb><h3 style=\"margin:8px 0 4px;font-size:16px\">რეგიონული / საქალაქო კოდები<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">M-30, M-40, M-50 — მადრიდის შემოვლითი გზები. სხვა რეგიონებში საკუთარი პრეფიქსებია, მაგალითად CM-, CL-, CV-.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><b style=\"display:inline-block;background:#1465a6;color:#fff;border-radius:7px;padding:4px 10px\">R-2<\u002Fb><h3 style=\"margin:8px 0 4px;font-size:16px\">Radial de peaje<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">მადრიდის რადიალური ავტომაგისტრალები ფასიანია. შესვლამდე შეამოწმე ტარიფი.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><b style=\"display:inline-block;background:#f1a13b;color:#17231d;border-radius:7px;padding:4px 10px\">C-607<\u002Fb><h3 style=\"margin:8px 0 4px;font-size:16px\">რეგიონული გზები<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">ავტონომიური გაერთიანებების გზები. სისტემა რეგიონების მიხედვით განსხვავდება.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#e9f3ec;border:1px solid #d4e6d9;border-radius:16px;padding:14px;margin-top:12px;font-size:14px\"><b style=\"color:#155c3e\">დაიმახსოვრე:<\u002Fb> A ჩვეულებრივ უფასოა; AP და R ხშირად ფასიანია. საბოლოო პასუხს იძლევა კონკრეტული მონაკვეთის ტარიფი და ნიშნები.<\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://sede.dgt.gob.es/export/sites/dgt/.galleries/permisos-de-conducir/certificacion-aptitud-profesores-formacion-vial/2025/Manual-I-Normas-y-Senales-2025.pdf\" target=\"_blank\" rel=\"noopener\">DGT · ნიშნებისა და წესების სახელმძღვანელო (PDF)<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"tolls\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 14px;letter-spacing:-.4px\">ფასიანი გზები<\u002Fh2>\n  <div style=\"display:grid;gap:10px\">\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><h3 style=\"margin:0 0 4px;font-size:16px\">ნიშანი „Peaje“<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">ნიშნავს გადასახადს. „Autopista de peaje“ ან „Peaje“ წარწერა ფასიან მონაკვეთზე მიუთითებს.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><h3 style=\"margin:0 0 4px;font-size:16px\">Vía-T<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">ელექტრონული გადახდის ზოლი. თუ არ გაქვს, გამოიყენე ბარათის ან ნაღდი ფულის ზოლი, სადაც ხელმისაწვდომია.<\u002Fp><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px\"><h3 style=\"margin:0 0 4px;font-size:16px\">Google Maps<\u002Fh3><p style=\"margin:0;color:#66736c;font-size:14px\">Route options-ში ჩართე „Avoid tolls / Evitar peajes“. „Avoid highways“ მუდმივად ნუ ჩართავ — ძალიან გრძელ მარშრუტს შეიძლება მოგცეს.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff1e9;border:1px solid #f2d7c9;border-radius:16px;padding:14px;margin-top:12px;font-size:14px\"><b style=\"color:#a23c28\">ყურადღება:<\u002Fb> „Avoid tolls“ მხოლოდ ფასიან გზებს არიდებს თავს. ის არ ნიშნავს ZBE-ის თავიდან აცილებას.<\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://support.google.com/maps/answer/3273406?co=GENIE.Platform%3DAndroid&amp;hl=en\" target=\"_blank\" rel=\"noopener\">Google Maps · ნავიგაციის დახმარება<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"zbe\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 14px;letter-spacing:-.4px\">ZBE — დაბალი ემისიის ზონები<\u002Fh2>\n  <div style=\"background:#10231d;color:#fff;border-radius:20px;padding:18px\">\n    <h3 style=\"margin:0 0 8px;font-size:19px\">Zona de Bajas Emisiones (ZBE)<\u002Fh3>\n    <p style=\"margin:0 0 12px;color:#cfdbd2;font-size:14px\">ადგილობრივი წესებით განსაზღვრული ტერიტორია, სადაც შესვლა შეიძლება შეიზღუდოს DGT ეტიკეტის მიხედვით.<\u002Fp>\n    <p style=\"margin:0 0 8px;font-size:14px\"><b style=\"color:#d9f36a\">1.<\u002Fb> შეხედე ZBE ნიშანს — კამერის სიმბოლო და დაშვებული ეტიკეტები.<\u002Fp>\n    <p style=\"margin:0 0 8px;font-size:14px\"><b style=\"color:#d9f36a\">2.<\u002Fb> ქალაქის წესები განსხვავდება; ერთი ქალაქის წესი მეორეზე არ ვრცელდება.<\u002Fp>\n    <p style=\"margin:0;font-size:14px\"><b style=\"color:#d9f36a\">3.<\u002Fb> Google Maps-ის მარშრუტი ნებართვა არ არის.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"background:#e9f3ec;border:1px solid #d4e6d9;border-radius:16px;padding:14px;margin-top:12px;font-size:14px\"><b style=\"color:#155c3e\">მადრიდი:<\u002Fb> Ayuntamiento de Madrid-ის FAQ-ის მიხედვით, M-40, M-45 და M-50 ქალაქის ურბანულ ქუჩებად არ ითვლება. M-12 და R-2 კი ფასიანია.<\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://www.madrid.es/portales/munimadrid/es/Inicio/Movilidad-y-transportes/Direcciones-y-telefonos/Preguntas-frecuentes-sobre-Madrid-Zona-de-Bajas-Emisiones-ZBE-/\" target=\"_blank\" rel=\"noopener\">Madrid · ZBE — ხშირად დასმული კითხვები<\u002Fa><\u002Fp>\n  <p style=\"margin:6px 0 0;font-size:13px\"><b>ვიტორიის კამერები (ZBE):<\u002Fb> <a href=\"https://www.vitoria-gasteiz.org/wb021/was/contenidoAction.do?idioma=en&amp;uid=u7627e050_18b933a5b58__2031\" target=\"_blank\" rel=\"noopener\">ვიტორია · სად არის ZBE-ის კამერები დამონტაჟებული<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"labels\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 14px;letter-spacing:-.4px\">DGT გარემოსდაცვითი ეტიკეტები<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px\">\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:10px 4px;text-align:center\"><div style=\"width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:#0874b9;color:#fff;display:grid;place-items:center;font-weight:900\">0<\u002Fdiv><b style=\"font-size:12px\">0 Emisiones<\u002Fb><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:10px 4px;text-align:center\"><div style=\"width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:linear-gradient(135deg,#008d55 50%,#0874b9 50%);color:#fff;display:grid;place-items:center;font-weight:900;font-size:11px\">ECO<\u002Fdiv><b style=\"font-size:12px\">ECO<\u002Fb><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:10px 4px;text-align:center\"><div style=\"width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:#35a64b;color:#fff;display:grid;place-items:center;font-weight:900\">C<\u002Fdiv><b style=\"font-size:12px\">C<\u002Fb><\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:10px 4px;text-align:center\"><div style=\"width:46px;height:46px;margin:0 auto 6px;border-radius:50%;background:#f2d21c;color:#26301f;display:grid;place-items:center;font-weight:900\">B<\u002Fdiv><b style=\"font-size:12px\">B<\u002Fb><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#e9f3ec;border:1px solid #d4e6d9;border-radius:16px;padding:14px;margin-top:12px;font-size:14px\"><b style=\"color:#155c3e\">A — ეტიკეტის გარეშე:<\u002Fb> DGT A სტიკერს არ გასცემს. ზუსტი კლასი შეამოწმე ავტომობილის ნომრით DGT-ის საძიებელში.<\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://www.dgt.es/nuestros-servicios/tu-vehiculo/tus-vehiculos/distintivo-ambiental/index.html\" target=\"_blank\" rel=\"noopener\">DGT · გარემოსდაცვითი ეტიკეტები<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"signs\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 14px;letter-spacing:-.4px\">საგზაო ნიშნები<\u002Fh2>\n  <div style=\"display:grid;gap:8px\">\n    <div style=\"display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px\"><div style=\"width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:#c9342f;color:#fff;display:grid;place-items:center;font-weight:900;font-size:11px\" aria-hidden=\"true\">STOP<\u002Fdiv><div><b style=\"font-size:14px\">STOP — სრული გაჩერება<\u002Fb><div style=\"font-size:13px;color:#66736c\">გაჩერდი ხაზთან, მაშინაც კი, თუ გზა თავისუფალია.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px\"><div style=\"width:46px;height:46px;flex:0 0 46px;border-radius:50%;border:5px solid #c9342f;background:#fff;color:#18251f;display:grid;place-items:center;font-weight:900\" aria-hidden=\"true\">50<\u002Fdiv><div><b style=\"font-size:14px\">სიჩქარის შეზღუდვა<\u002Fb><div style=\"font-size:13px;color:#66736c\">წითელი რგოლი — მაქსიმალური სიჩქარე კმ/სთ-ში.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px\"><div style=\"width:46px;height:46px;flex:0 0 46px;background:#1765a5;border-radius:8px;color:#fff;display:grid;place-items:center;font-weight:900\" aria-hidden=\"true\">A<\u002Fdiv><div><b style=\"font-size:14px\">Autopista / Autovía<\u002Fb><div style=\"font-size:13px;color:#66736c\">ლურჯი მართკუთხა ნიშანი გზის ტიპს აღნიშნავს.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px\"><div style=\"width:46px;height:46px;flex:0 0 46px;background:#1765a5;border-radius:8px;color:#fff;display:grid;place-items:center;font-weight:900\" aria-hidden=\"true\">P<\u002Fdiv><div><b style=\"font-size:14px\">Peaje / ფასიანი გზა<\u002Fb><div style=\"font-size:13px;color:#66736c\">წინასწარ გადაწყვიტე, გინდა თუ არა ამ გზაზე შესვლა.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://sede.dgt.gob.es/export/sites/dgt/.galleries/permisos-de-conducir/certificacion-aptitud-profesores-formacion-vial/2025/Manual-I-Normas-y-Senales-2025.pdf\" target=\"_blank\" rel=\"noopener\">DGT · ნიშნების სახელმძღვანელო (PDF)<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"radars\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 14px;letter-spacing:-.4px\">რადარები და კამერები<\u002Fh2>\n  <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px;font-size:14px;color:#3b4a42\">\n    ესპანეთში არის ფიქსირებული რადარები, მობილური რადარები და ტრაექტორიის (ტუნელის/გზის სეგმენტის) კამერები. ალავაში (ვიტორიის პროვინცია) გზებზე დაახლოებით 20 ფიქსირებული რადარია; ზუსტი ადგილები მოცემულია ქვემოთ ბმულზე.\n  <\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ალავას რადარები:<\u002Fb> <a href=\"https://www.gasteizhoy.com/los-20-radares-fijos-en-las-carreteras-de-alava-donde-estan/\" target=\"_blank\" rel=\"noopener\">გასტეიჰოი · 20 ფიქსირებული რადარი ალავაში<\u002Fa><\u002Fp>\n  <p style=\"margin:6px 0 0;font-size:13px\"><b>რუკა (მესამე მხარის):<\u002Fb> <a href=\"https://www.race.es/mapa-radares\" target=\"_blank\" rel=\"noopener\">RACE · რადარების რუკა<\u002Fa><\u002Fp>\n  <p style=\"margin:6px 0 0;font-size:13px\"><b>ვიტორიის ZBE კამერები:<\u002Fb> <a href=\"https://www.vitoria-gasteiz.org/wb021/was/contenidoAction.do?idioma=en&amp;uid=u7627e050_18b933a5b58__2031\" target=\"_blank\" rel=\"noopener\">ვიტორია · ZBE კამერები<\u002Fa><\u002Fp>\n  <p style=\"margin:6px 0 0;font-size:13px\"><b>ვიტორიის რადარების რუკა:<\u002Fb> <a href=\"https://www.vitoria-gasteiz.org/geovitoria/geo?idioma=en#YWNjaW9uPXNob3dDb2xlY2Npb24maWQ9MTM4JnRpcG89ZyZub21icmU9JmFwbGljYWNpb249SjE2Jm49dW5kZWZpbmVk\" target=\"_blank\" rel=\"noopener\">ვიტორია · GeoVitoria — რადარები<\u002Fa><\u002Fp>\n  <p style=\"margin:6px 0 0;font-size:13px\"><b>ვიტორიის ZBE კამერების რუკა:<\u002Fb> <a href=\"https://www.vitoria-gasteiz.org/geovitoria/geo?idioma=en#YWNjaW9uPXNob3cmaWQ9Mzg3MzQ=\" target=\"_blank\" rel=\"noopener\">ვიტორია · GeoVitoria — ZBE კამერები<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"parking\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 4px;letter-spacing:-.4px\">პარკირება და ფერები<\u002Fh2>\n  <p style=\"margin:0 0 14px;font-size:13px;color:#66736c\">ფერი ყოველთვის ზონის ნიშანსა და ქალაქის წესზე დაყრდნობით გაიგე. ფოტოზე შეხებით გაიშლება.<\u002Fp>\n  <div style=\"display:grid;gap:10px\">\n    <sc-for list=\"{{ colors }}\" as=\"c\" hint-placeholder-count=\"7\">\n      <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px\">\n        <div style=\"display:flex;gap:10px;align-items:center\"><span aria-hidden=\"true\" style=\"flex:0 0 auto;min-width:64px;height:34px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;{{ c.swatch }}\">{{ c.label }}<\u002Fspan><b style=\"font-size:15px\">{{ c.name }}<\u002Fb><\u002Fdiv>\n        <p style=\"margin:8px 0 0;font-size:14px;color:#3b4a42\">{{ c.desc }}<\u002Fp>\n        <sc-if value=\"{{ c.hasPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ c.open }}\" aria-label=\"{{ c.alt }} — გადიდება\" style=\"display:block;width:100%;margin-top:10px;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:#e8eee9\">\n            <img src=\"{{ c.src }}\" alt=\"{{ c.alt }}\" loading=\"lazy\" style=\"display:block;width:100%;height:150px;object-fit:cover\">\n          <\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ c.noPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top:10px;border:1px dashed #b9c4bc;border-radius:12px;padding:14px;font-size:12px;color:#66736c;text-align:center\">ფოტო დაემატება<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#fff1e9;border:1px solid #f2d7c9;border-radius:16px;padding:14px;margin-top:12px;font-size:14px\"><b style=\"color:#a23c28\">მნიშვნელოვანია:<\u002Fb> ფერებისა და ტარიფების ერთიანი ეროვნული წესი არ არსებობს. ადგილზე არსებული ნიშანი და მუნიციპალიტეტის წესი გადამწყვეტია.<\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://www.vitoria-gasteiz.org/wb021/was/contenidoAction.do?idioma=es&amp;uid=_322669dd_12392bd72e2__7fd0\" target=\"_blank\" rel=\"noopener\">ვიტორია · OTA წესები და ზონები<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"ota\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 14px;letter-spacing:-.4px\">ვიტორიის OTA<\u002Fh2>\n  <div style=\"background:#10231d;color:#fff;border-radius:14px;padding:14px 16px;font-size:15px\">\n    <b style=\"color:#d9f36a\">ახლა:<\u002Fb> {{ otaStatus }}\n    <div style=\"font-size:12px;color:#cfdbd2;margin-top:6px\">სტატუსი ითვლება თქვენი მოწყობილობის საათით და ზემოთ მოცემული გრაფიკით. გვერდის ხელახლა ჩატვირთვისას განახლდება.<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #e4e9e3;border-radius:18px;padding:16px;margin-top:12px;font-size:14px\">\n    <div style=\"font-size:14px;font-weight:800;margin-bottom:8px\">გრაფიკი<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;margin-bottom:12px\">\n      <div style=\"background:#e9f3ec;border-radius:12px;padding:10px\"><b>ორშ.–პარასკ.<\u002Fb><br>10:00–14:00<br>16:00–20:00<\u002Fdiv>\n      <div style=\"background:#e9f3ec;border-radius:12px;padding:10px\"><b>შაბათი<\u002Fb><br>10:00–14:00<\u002Fdiv>\n      <div style=\"background:#e9f3ec;border-radius:12px;padding:10px\"><b>კვირა და უქმე (ფიესტები)<\u002Fb><br>უფასო<\u002Fdiv>\n      <div style=\"background:#e9f3ec;border-radius:12px;padding:10px\"><b>აგვისტო<\u002Fb><br>უფასო<\u002Fdiv>\n    <\u002Fdiv>\n    <b>ტარიფი (დაფიდან):<\u002Fb> 0–15 წთ €0,00 · 16–30 წთ €1,35 · 60 წთ €2,15 · 75 წთ €2,55 · 90 წთ €2,95 · 8 სთ €8,30. ტურისტის მაქს. დრო 90 წთ.\n  <\u002Fdiv>\n  <div style=\"background:#fff1e9;border:1px solid #f2d7c9;border-radius:16px;padding:14px;margin-top:12px;font-size:14px\"><b style=\"color:#a23c28\">15 წთ უფასო არ ნიშნავს უბრალოდ გაჩერებას:<\u002Fb> უფასო ბილეთიც აიღე აპარატიდან. ერთ პარკირებაზე მხოლოდ ერთი ბილეთი გაიცემა; კონტროლი ნომრის ამოცნობით ხდება.<\u002Fdiv>\n  <div style=\"background:#fff1e9;border:1px solid #f2d7c9;border-radius:16px;padding:14px;margin-top:10px;font-size:14px\"><b style=\"color:#a23c28\">ვიტორიის ZBE:<\u002Fb> ძალაშია 2025 წლის 15 სექტემბრიდან; ეტიკეტის არმქონე ავტომობილებს შესვლა შეეზღუდათ. გამონაკლისები ოფიციალურ გვერდზე გადაამოწმე — OTA ბილეთი ZBE-ში შესვლის ნებართვას არ ნიშნავს.<\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://www.vitoria-gasteiz.org/wb021/was/contenidoAction.do?idioma=es&amp;uid=76285fcc_124092fd2a9__7fc1\" target=\"_blank\" rel=\"noopener\">ვიტორია · OTA FAQ<\u002Fa> · <a href=\"https://www.vitoria-gasteiz.org/wb021/was/contenidoAction.do?idioma=es&amp;uid=u_608f5eff_12d0d73af5c__7ff8\" target=\"_blank\" rel=\"noopener\">ვიტორია · ZBE<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"dictionary\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 4px;letter-spacing:-.4px\">ლექსიკონი<\u002Fh2>\n  <p style=\"margin:0 0 14px;font-size:13px;color:#66736c\">დააჭირე ტერმინს სრული ახსნისთვის.<\u002Fp>\n\n  <h3 style=\"font-size:17px;margin:14px 0 8px\">ნიშნები და გზა<\u002Fh3>\n  <div style=\"display:grid;gap:8px\">\n    <sc-for list=\"{{ dictRoad }}\" as=\"d\" hint-placeholder-count=\"4\">\n      <details style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\">\n        <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span><b style=\"display:block;color:#176b4a;font-weight:800;font-size:14px\">{{ d.es }}<\u002Fb><span style=\"font-size:14px\">{{ d.ka }}<\u002Fspan><\u002Fspan><span aria-hidden=\"true\" style=\"font-size:20px;color:#66736c\">+<\u002Fspan><\u002Fsummary>\n        <div style=\"margin-top:10px;font-size:14px;color:#3b4a42\">{{ d.body }}<\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:17px;margin:20px 0 8px\">ესპანური სპეციფიკა<\u002Fh3>\n  <div style=\"display:grid;gap:8px\">\n    <sc-for list=\"{{ dictSpain }}\" as=\"d\" hint-placeholder-count=\"4\">\n      <details style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\">\n        <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span><b style=\"display:block;color:#176b4a;font-weight:800;font-size:14px\">{{ d.es }}<\u002Fb><span style=\"font-size:14px\">{{ d.ka }}<\u002Fspan><\u002Fspan><span aria-hidden=\"true\" style=\"font-size:20px;color:#66736c\">+<\u002Fspan><\u002Fsummary>\n        <div style=\"margin-top:10px;font-size:14px;color:#3b4a42\">{{ d.body }}<\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:17px;margin:20px 0 8px\">დოკუმენტები და პოლიცია<\u002Fh3>\n  <div style=\"display:grid;gap:8px\">\n    <sc-for list=\"{{ dictPolice }}\" as=\"d\" hint-placeholder-count=\"4\">\n      <details style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\">\n        <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span><b style=\"display:block;color:#176b4a;font-weight:800;font-size:14px\">{{ d.es }}<\u002Fb><span style=\"font-size:14px\">{{ d.ka }}<\u002Fspan><\u002Fspan><span aria-hidden=\"true\" style=\"font-size:20px;color:#66736c\">+<\u002Fspan><\u002Fsummary>\n        <div style=\"margin-top:10px;font-size:14px;color:#3b4a42\">{{ d.body }}<\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <h3 style=\"font-size:17px;margin:20px 0 8px\">ავარია და დაზღვევა<\u002Fh3>\n  <div style=\"display:grid;gap:8px\">\n    <sc-for list=\"{{ dictAccident }}\" as=\"d\" hint-placeholder-count=\"4\">\n      <details style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\">\n        <summary style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\"><span><b style=\"display:block;color:#176b4a;font-weight:800;font-size:14px\">{{ d.es }}<\u002Fb><span style=\"font-size:14px\">{{ d.ka }}<\u002Fspan><\u002Fspan><span aria-hidden=\"true\" style=\"font-size:20px;color:#66736c\">+<\u002Fspan><\u002Fsummary>\n        <div style=\"margin-top:10px;font-size:14px;color:#3b4a42\">{{ d.body }}<\u002Fdiv>\n      <\u002Fdetails>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <p style=\"margin:12px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://sede.dgt.gob.es/export/sites/dgt/.galleries/permisos-de-conducir/certificacion-aptitud-profesores-formacion-vial/2025/Manual-I-Normas-y-Senales-2025.pdf\" target=\"_blank\" rel=\"noopener\">DGT · ნიშნების სახელმძღვანელო (PDF)<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<section id=\"situations\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 14px;letter-spacing:-.4px\">სიტუაციები<\u002Fh2>\n  <div style=\"display:grid;gap:10px\">\n    <details open=\"\" style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\"><summary style=\"font-weight:800;font-size:15px\">🚗 ავარია — Accidente<\u002Fsummary>\n      <div style=\"font-size:14px;color:#3b4a42;margin-top:10px\">\n        <p style=\"margin:0 0 8px\"><b>PAS:<\u002Fb> Proteger (დაიცავი ადგილი, ჩართე ავარიული მაშუქები) · Avisar (112) · Socorrer (დახმარება მხოლოდ უსაფრთხოდ).<\u002Fp>\n        <p style=\"margin:0 0 8px\">დადე <b>triángulo<\u002Fb> და ჩაიცვი <b>chaleco reflectante<\u002Fb> მანქანიდან გადმოსვლამდე.<\u002Fp>\n        <p style=\"margin:0 0 8px\">თუ ორივე მხარე თანახმაა, შეავსეთ <b>parte amistoso<\u002Fb> (მეგობრული ანგარიში) და გადაუღე ფოტოები.<\u002Fp>\n        <p style=\"margin:0\">ჰკითხე: <i>¿Está usted herido?<\u002Fi> — დაშავებული ხარ? · <i>Necesito una grúa.<\u002Fi> — ევაკუატორი მჭირდება.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://www.dgt.es/muevete-con-seguridad/que-hacer-ante-un-accidente-de-trafico/\" target=\"_blank\" rel=\"noopener\">DGT · ავარიის დროს<\u002Fa><\u002Fp>\n    <\u002Fdetails>\n    <details style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\"><summary style=\"font-weight:800;font-size:15px\">🛡️ დაზღვევასთან დარეკვა — Seguro<\u002Fsummary>\n      <div style=\"font-size:14px;color:#3b4a42;margin-top:10px\">\n        <p style=\"margin:0 0 8px\">მოამზადე: <b>póliza<\u002Fb> (პოლისის ნომერი), <b>matrícula<\u002Fb> (სახელმწიფო ნომერი), <b>DNI / NIE / პასპორტი<\u002Fb>.<\u002Fp>\n        <p style=\"margin:0 0 8px\"><i>Tengo un accidente en la A-1, km 45.<\u002Fi> — ავარია მაქვს A-1-ზე, კმ 45.<\u002Fp>\n        <p style=\"margin:0 0 8px\"><i>Hay un herido.<\u002Fi> — დაშავებული არის.<\u002Fp>\n        <p style=\"margin:0\">დაზღვევის ნომერი პოლისზე წერია; შეინახე ტელეფონში.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdetails>\n    <details style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\"><summary style=\"font-weight:800;font-size:15px\">👮 პოლიციამ გაგაჩერა — Control policial<\u002Fsummary>\n      <div style=\"font-size:14px;color:#3b4a42;margin-top:10px\">\n        <p style=\"margin:0 0 8px\">შეანელე, ჩართე მაჩვენებელი, გააჩერე უსაფრთხო ადგილას. დარჩი მანქანაში, ხელები ხილულად გქონდეს.<\u002Fp>\n        <p style=\"margin:0 0 8px\">დოკუმენტები: <b>carné de conducir<\u002Fb> (მართვის მოწმობა), <b>permiso de circulación<\u002Fb> (ტექნიკური პასპორტი), <b>seguro<\u002Fb> (დაზღვევა), <b>ITV<\u002Fb>.<\u002Fp>\n        <p style=\"margin:0 0 8px\"><i>No hablo español.<\u002Fi> — ესპანურად არ ვლაპარაკობ. · <i>¿Puede repetir, por favor?<\u002Fi> — გაიმეორებთ, გთხოვთ?<\u002Fp>\n        <p style=\"margin:0\">თუ გთხოვენ <b>alcoholemia<\u002Fb>-ს (სუნთქვის ტესტი) — დაემორჩილე.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdetails>\n    <details style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\"><summary style=\"font-weight:800;font-size:15px\">🛠️ მანქანა გაფუჭდა — Avería<\u002Fsummary>\n      <div style=\"font-size:14px;color:#3b4a42;margin-top:10px\">\n        <p style=\"margin:0 0 8px\">გადადი უსაფრთხო ადგილას, ჩართე ავარიული მაშუქები. გაჩერებული მანქანის გასაფრთხილებლად ესპანეთში 2026 წლიდან <b>V-16<\u002Fb> მაშუქი გამოიყენება — მოათავსე სახურავზე ხილულ ადგილას.<\u002Fp>\n        <p style=\"margin:0\">ევაკუატორისთვის დარეკე დაზღვევის <b>asistencia en carretera<\u002Fb> ნომერზე, არა 112-ზე.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://www.dgt.es/muevete-con-seguridad/tecnologia-e-innovacion-en-carretera/Dispositivos-de-presenalizacion-V16/\" target=\"_blank\" rel=\"noopener\">DGT · V-16 წესები<\u002Fa><\u002Fp>\n    <\u002Fdetails>\n    <details style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:12px 14px\"><summary style=\"font-weight:800;font-size:15px\">📨 ჯარიმა — Multa<\u002Fsummary>\n      <div style=\"font-size:14px;color:#3b4a42;margin-top:10px\">\n        <p style=\"margin:0 0 8px\">ნახე ვინ გამოსცა: DGT, Ayuntamiento თუ ავტონომიური ორგანო. გადაამოწმე ნომერი, ადგილი, თარიღი.<\u002Fp>\n        <p style=\"margin:0 0 8px\">DGT-ის ჯარიმაზე 20 კალენდარულ დღეში შესაძლებელია 50%-იანი შეღავათით გადახდა; გადახდა გასაჩივრების უფლებაზე უარს ნიშნავს.<\u002Fp>\n        <p style=\"margin:0\">არ ეთანხმები — ვადაში წარადგინე <b>alegaciones<\u002Fb>, შეღავათი იკარგება.<\u002Fp>\n      <\u002Fdiv>\n      <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://www.dgt.es/nuestros-servicios/multas-y-sanciones/que-hacer-si-has-recibido-una-multa/\" target=\"_blank\" rel=\"noopener\">DGT · ჯარიმის მიღების შემდეგ<\u002Fa><\u002Fp>\n    <\u002Fdetails>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"emergency\" style=\"padding-top:32px\">\n  <h2 style=\"font-size:24px;margin:0 0 14px;letter-spacing:-.4px\">საგანგებო ნომრები<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px\">\n    <a href=\"tel:112\" style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px;text-decoration:none;color:#18251f\"><b style=\"display:block;font-size:26px;color:#176b4a\">112<\u002Fb><span style=\"font-size:12px;color:#66736c\">საერთო საგანგებო<\u002Fspan><\u002Fa>\n    <a href=\"tel:062\" style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px;text-decoration:none;color:#18251f\"><b style=\"display:block;font-size:26px;color:#176b4a\">062<\u002Fb><span style=\"font-size:12px;color:#66736c\">Guardia Civil<\u002Fspan><\u002Fa>\n    <a href=\"tel:091\" style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px;text-decoration:none;color:#18251f\"><b style=\"display:block;font-size:26px;color:#176b4a\">091<\u002Fb><span style=\"font-size:12px;color:#66736c\">Policía Nacional<\u002Fspan><\u002Fa>\n    <a href=\"tel:092\" style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px;text-decoration:none;color:#18251f\"><b style=\"display:block;font-size:26px;color:#176b4a\">092<\u002Fb><span style=\"font-size:12px;color:#66736c\">Policía Local<\u002Fspan><\u002Fa>\n    <a href=\"tel:011\" style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px;text-decoration:none;color:#18251f\"><b style=\"display:block;font-size:26px;color:#176b4a\">011<\u002Fb><span style=\"font-size:12px;color:#66736c\">საგზაო მოძრაობა (DGT)<\u002Fspan><\u002Fa>\n    <a href=\"tel:060\" style=\"background:#fff;border:1px solid #e4e9e3;border-radius:16px;padding:14px;text-decoration:none;color:#18251f\"><b style=\"display:block;font-size:26px;color:#176b4a\">060<\u002Fb><span style=\"font-size:12px;color:#66736c\">DGT ადმინისტრაცია<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n  <div style=\"background:#e9f3ec;border:1px solid #d4e6d9;border-radius:16px;padding:14px;margin-top:12px;font-size:14px\"><b style=\"color:#155c3e\">112<\u002Fb> — მხოლოდ საფრთხის ან დაშავებულის შემთხვევაში.<\u002Fdiv>\n  <p style=\"margin:10px 0 0;font-size:13px\"><b>ოფიციალური წყარო:<\u002Fb> <a href=\"https://www.dgt.es/muevete-con-seguridad/viaja-seguro/consejos-extranjeros/en-caso-de-emergencia/index.html\" target=\"_blank\" rel=\"noopener\">DGT · საგანგებო მოქმედებები<\u002Fa><\u002Fp>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid #e4e9e3;margin-top:36px;padding-top:18px;color:#66736c;font-size:12px\">\n  <b style=\"color:#18251f\">სანდო წყაროები და შემოწმება<\u002Fb>\n  <p style=\"margin:6px 0 0\">ეს გვერდი სწრაფი საცნობარო გზამკვლევია და არა სამართლებრივი კონსულტაცია. ნიშნები და ქალაქის წესები შეიძლება შეიცვალოს — გადაამოწმე ოფიციალურ წყაროებზე.<\u002Fp>\n  <p style=\"margin:10px 0 0\">განახლების თარიღი: 15 ნოემბერი 2026 · España Drive<\u002Fp>\n<\u002Ffooter>\n\n<button type=\"button\" sc-camel-on
